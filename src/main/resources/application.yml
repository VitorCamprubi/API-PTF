spring:
  application:
    name: api-ptf

  datasource:
    url: jdbc:postgresql://localhost:5433/ptf
    username: ptf
    password: ptf
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: ptf-pool
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  rabbitmq:
    host: localhost
    port: 5672
    username: ptf
    password: ptf
    listener:
      simple:
        # Agora com quatro consumidores. Isso so passou a ser seguro depois do
        # lock pessimista no saldo: sem ele, duas mensagens da mesma conta
        # processadas ao mesmo tempo causariam perda de atualizacao, porque as
        # duas leriam o mesmo saldo e a ultima a gravar apagaria a outra.
        # Mensagens de contas diferentes seguem em paralelo de verdade; as da
        # mesma conta se enfileiram no SELECT ... FOR UPDATE.
        concurrency: 4
        max-concurrency: 8
        # Mensagem que falhou nao volta para a fila sozinha. Sem isso, um erro
        # permanente vira laco infinito de reentrega.
        default-requeue-rejected: false

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
