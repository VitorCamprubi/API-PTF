spring:
  application:
    name: api-ptf

  datasource:
    url: jdbc:postgresql://localhost:5433/ptf
    username: ptf
    password: ptf
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: ptf-pool
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  rabbitmq:
    host: localhost
    port: 5672
    username: ptf
    password: ptf
    listener:
      simple:
        # Agora com quatro consumidores. Isso so passou a ser seguro depois do
        # lock pessimista no saldo: sem ele, duas mensagens da mesma conta
        # processadas ao mesmo tempo causariam perda de atualizacao, porque as
        # duas leriam o mesmo saldo e a ultima a gravar apagaria a outra.
        # Mensagens de contas diferentes seguem em paralelo de verdade; as da
        # mesma conta se enfileiram no SELECT ... FOR UPDATE.
        concurrency: 4
        max-concurrency: 8
        # Mensagem rejeitada nao volta para o fim da fila: vai para a dead letter
        # exchange. Com true, um erro permanente viraria laco infinito de
        # reentrega e a DLQ nunca receberia nada.
        default-requeue-rejected: false
        retry:
          # Retentativas em memoria, dentro do proprio consumidor, antes de
          # desistir. Servem para falha transitoria: banco que piscou, timeout de
          # rede, deadlock. Falha de negocio nem chega aqui, porque o listener a
          # trata e confirma a mensagem.
          enabled: true
          max-attempts: 3
          # Espera crescente entre tentativas: 500ms, 1s, 2s. Repetir na mesma
          # cadencia contra um banco sobrecarregado so piora a sobrecarga.
          initial-interval: 500ms
          multiplier: 2
          max-interval: 5s

ptf:
  outbox:
    # Intervalo entre ciclos do publicador. E o atraso maximo que uma transacao
    # espera antes de sair para a fila; o custo de diminuir e mais consultas ao
    # banco por segundo, quase sempre vazias.
    intervalo-ms: 500
    tamanho-do-lote: 50

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        # prometheus e o endpoint que o servidor de metricas raspa de tempos em
        # tempos. Exposto aqui porque o ambiente e local; em producao ele fica numa
        # porta separada da porta de negocio, alcancavel so pela rede interna.
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    distribution:
      # Sem isto, as metricas de HTTP so tem contagem e soma, e media de latencia
      # esconde exatamente o que interessa: a minoria de requisicoes lentas. Com
      # histograma da para perguntar p95 e p99.
      percentiles-histogram:
        http.server.requests: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
