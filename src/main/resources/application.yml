spring:
  application:
    name: api-ptf

  datasource:
    url: jdbc:postgresql://localhost:5433/ptf
    username: ptf
    password: ptf
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: ptf-pool
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  rabbitmq:
    host: localhost
    port: 5672
    username: ptf
    password: ptf
    listener:
      simple:
        # Um consumidor so, por enquanto. Com mais de um, duas mensagens da mesma
        # conta seriam processadas ao mesmo tempo e o saldo sofreria perda de
        # atualizacao: as duas leem o mesmo valor e a ultima a gravar apaga o
        # trabalho da outra. A etapa 13 resolve isso com lock pessimista e so
        # entao vale aumentar este numero.
        concurrency: 1
        max-concurrency: 1
        # Mensagem que falhou nao volta para a fila sozinha. Sem isso, um erro
        # permanente vira laco infinito de reentrega.
        default-requeue-rejected: false

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
