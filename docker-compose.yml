services:
  postgres:
    image: postgres:16-alpine
    container_name: api-ptf-postgres
    environment:
      POSTGRES_DB: ptf
      POSTGRES_USER: ptf
      POSTGRES_PASSWORD: ptf
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ptf -d ptf"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
